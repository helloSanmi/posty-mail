    <script>
      /* Applies the stored theme BEFORE first paint. Without this the page
         renders light and then flips, which on a dark theme is worse than
         having no dark theme at all.

         Deliberately inline and tiny: a separate file would be another
         round trip before paint, which is the thing this exists to avoid.
         Wrapped in try/catch because localStorage throws outright in some
         privacy modes, and a theme preference is never worth a blank page. */
      (function () {
        try {
          var g = localStorage.getItem('posty.theme');
