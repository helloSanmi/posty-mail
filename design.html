<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Posty — design sandbox</title>
    <!--
      IBM Plex, loaded from a CDN for REVIEW ONLY.

      Production must self-host these files. Posty is a self-hosted product
      run by small businesses for their own mailing lists; making every one
      of their recipients' admin sessions call a third-party font CDN is a
      dependency and a privacy leak they did not ask for. Plex is OFL, so
      shipping the woff2 files is permitted and is what the real app will
      do (@fontsource/ibm-plex-sans, or the files committed directly).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <!--
      SECOND VITE ENTRY, DEV ONLY.

      Vite's production build takes `index.html` as its only input unless
      `build.rollupOptions.input` says otherwise — which it does not — so
      nothing in here reaches the real app. `npm run build` output is
      unchanged by this file's existence.

      Run `npm run dev` and open http://localhost:5173/design.html to review
      redesigned pages before they are ported into src/pages/.
    -->
    <div id="design-root"></div>
    <script type="module" src="/src/design/main.jsx"></script>
  </body>
</html>
