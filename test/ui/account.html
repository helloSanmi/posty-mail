<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account menu probe</title>
    <!-- The REAL AccountMenu in a real topbar row, so the trigger can be
         measured against the controls it sits beside and the menu can be
         opened and looked at. Dev-only; vite builds index.html alone. -->
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      body { background: var(--bg); margin: 0; padding: 16px; }
      .sh { border: 1px solid var(--border); border-radius: 10px; min-height: 420px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createRoot } from 'react-dom/client';
      import { createElement as h } from 'react';
      import { AccountMenu } from '/src/components/AccountMenu.jsx';
      import { apiClient } from '/src/services/apiClient.js';
      import { AppearanceControls } from '/src/components/AppearanceControls.jsx';

      // An Editor, deliberately: the access list is the interesting half of
      // the profile panel, and an admin's would just say "everything".
      const USER = {
        id: 'u1',
        email: 'sanmi.idowu@example.com',
        name: 'Sanmi Idowu',
        location: 'Lagos',
        role: 'editor',
        permissions: {
          v: 2,
          areas: {
            contacts: 'write',
            templates: 'write',
            campaigns: 'manage',
            analytics: 'read',
            forms: 'read',
            bounces: 'read',
            unsubscribes: 'read',
          },
        },
      };

      // The profile form talks to two endpoints; stub at the adapter so the
      // component's own request code runs unchanged.
      apiClient.defaults.adapter = async (config) => ({
        data: config.url.includes('/password')
          ? { token: 'fresh', ok: true }
          : { user: { ...USER, ...(config.data ? JSON.parse(config.data) : {}) } },
        status: 200, statusText: 'OK', headers: {}, config,
      });

      function Probe() {
        return h('main', { className: 'sh', 'data-section': 'home' },
          h('aside', { className: 'sh-side' }, h('div', { className: 'sh-brand' }, 'Posty')),
          h('section', { className: 'sh-main' },
            h('header', { className: 'sh-top' },
              h('div', { className: 'sh-title' },
                h('p', { className: 'sh-greeting' }, 'Good morning, Sanmi')),
              h('button', { type: 'button', className: 'sh-search' },
                h('span', { className: 'sh-search-label' }, 'Search'),
                h('kbd', null, '⌘K')),
              h(AppearanceControls),
              h(AccountMenu, {
                user: USER,
                roleName: 'Editor',
                onSignOut: () => console.log('[probe] sign out'),
                onProfileSaved: (u) => console.log('[probe] saved', u),
                notify: (m) => console.log('[probe] notify', m),
              })),
            h('div', { className: 'sh-content' })));
      }
      createRoot(document.getElementById('root')).render(h(Probe));
    </script>
  </body>
</html>
