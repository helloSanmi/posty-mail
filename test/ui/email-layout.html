<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Email layout probe</title>
    <!-- Reproduces the Email page's real DOM — the shell grid, the em-grid
         three-column layout and the REAL EmailPreview component — against
         the real stylesheets, so the overflow can be measured instead of
         reasoned about. Dev-only; vite builds index.html alone. -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module">
      import { createRoot } from 'react-dom/client';
      import { createElement as h, useState } from 'react';
      import { EmailPreview } from '/src/components/EmailPreview.jsx';
      import { TemplateList } from '/src/components/TemplateList.jsx';
      import { AppearanceMenu } from '/src/components/AppearanceMenu.jsx';

      function Probe() {
        const [client, setClient] = useState('gmail');
        const [device, setDevice] = useState('computer');
        const [dark, setDark] = useState(false);
        const [tab, setTab] = useState('edit');
        return h('main', { className: 'sh' },
          h('aside', { className: 'sh-side' }, h('div', { className: 'sh-brand' }, 'Posty')),
          h('section', { className: 'sh-main' },
            h('header', { className: 'sh-top' },
              h('div', { className: 'sh-title' }, h('h1', null, 'Email')),
              h(AppearanceMenu)),
            h('div', { className: 'sh-content' },
              h('div', { className: 'page-stack template-page' },
                h('div', { className: 'em-grid' },
                  h(TemplateList, {
                    templates: Array.from({ length: 12 }, (_, i) => ({
                      id: 't' + i, name: 'Template ' + (i + 1), subject: 'Subject line ' + (i + 1),
                    })),
                    selectedTemplateId: 't0',
                    onSelect: () => {},
                    onNew: () => {},
                    onStartFromGallery: () => {},
                  }),
                  h('section', { className: 'em-card em-editor' },
                    h('div', { className: 'em-card-head' },
                      h('h2', null, 'Untitled template'),
                      h('div', { className: 'em-head-right' },
                        h('span', { className: 'status-line' }, 'Saved'),
                      h('div', { className: 'em-tabs', role: 'tablist' },
                        h('button', {
                          type: 'button', role: 'tab', id: 'em-tab-edit',
                          'aria-selected': tab === 'edit',
                          className: 'em-tab' + (tab === 'edit' ? ' is-active' : ''),
                          onClick: () => setTab('edit'),
                        }, 'Edit'),
                        h('button', {
                          type: 'button', role: 'tab', id: 'em-tab-preview',
                          'aria-selected': tab === 'preview',
                          className: 'em-tab' + (tab === 'preview' ? ' is-active' : ''),
                          onClick: () => setTab('preview'),
                        }, 'Preview')))),
                    h('div', { role: 'tabpanel', id: 'em-panel-edit', hidden: tab !== 'edit' },
                      h('div', { className: 'em-fields' },
                        h('label', null, 'Name', h('input', { readOnly: true, value: '' })),
                        h('label', null, 'Subject', h('input', { readOnly: true, value: '' })),
                        h('div', { style: { height: '1800px' } }, 'tall content'))),
                    h('div', { role: 'tabpanel', id: 'em-panel-preview', hidden: tab !== 'preview' },
                      h(EmailPreview, {
                        subject: '',
                        previewClient: client, setPreviewClient: setClient,
                        previewDevice: device, setPreviewDevice: setDevice,
                        previewHtml: '<p>hi</p>',
                        previewDark: dark, setPreviewDark: setDark,
                      })))))))); 
      }
      createRoot(document.getElementById('root')).render(h(Probe));
    </script>
  </body>
</html>
