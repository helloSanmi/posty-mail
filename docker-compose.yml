services:
  postgres:
    image: postgres:16-alpine
    container_name: campaign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign_password
      POSTGRES_DB: campaign_app
    ports:
      - "5432:5432"
    volumes:
      - campaign_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campaign_postgres_data:
